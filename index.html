<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartier Private Selection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1a17;--mute:#8a8178;--line:#e8e2da;--bg:#fbf9f6;--card:#fff;--red:#8c1c24;--gold:#a8874f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.serif{font-family:"Cormorant Garamond",Georgia,serif}

/* gate */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:50;padding:24px}
#gate form{width:100%;max-width:360px;text-align:center}
#gate .mark{font-family:"Cormorant Garamond",serif;font-size:44px;letter-spacing:.32em;padding-left:.32em;font-weight:500}
#gate .sub{color:var(--mute);font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin:10px 0 40px}
#gate input{width:100%;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:12px 4px;font:inherit;font-size:16px;text-align:center;letter-spacing:.1em;outline:none}
#gate button{margin-top:28px;width:100%;padding:14px;background:var(--ink);color:#fff;letter-spacing:.2em;text-transform:uppercase;font-size:12px;font-weight:400}
#gate .err{color:var(--red);font-size:13px;height:20px;margin-top:14px}

/* header */
header{padding:56px 24px 28px;text-align:center;border-bottom:1px solid var(--line)}
header .mark{font-family:"Cormorant Garamond",serif;font-size:clamp(34px,6vw,54px);letter-spacing:.32em;padding-left:.32em;font-weight:500}
header .sub{color:var(--mute);font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin-top:10px}
header .note{color:var(--mute);font-size:14px;margin-top:18px}

/* layout */
.wrap{max-width:1360px;margin:0 auto;padding:0 24px}
.cats{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:22px 0 8px}
.cats button{padding:9px 18px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid transparent}
.cats button.on{color:var(--ink);border-bottom-color:var(--ink)}
.cats button span{font-size:11px;margin-left:4px;opacity:.7}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;padding:14px 0 26px;border-bottom:1px solid var(--line)}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:#fff;padding:10px 34px 10px 14px;font:inherit;font-size:13px;color:var(--ink);border-radius:999px;cursor:pointer;min-width:150px}
.sel:after{content:"";position:absolute;right:15px;top:50%;width:6px;height:6px;border-right:1px solid var(--mute);border-bottom:1px solid var(--mute);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.search{border:1px solid var(--line);background:#fff;padding:10px 16px;border-radius:999px;font:inherit;font-size:13px;min-width:200px;outline:none}
.search:focus,.sel select:focus{border-color:var(--gold)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;user-select:none}
.chk input{accent-color:var(--ink)}
.meta{display:flex;justify-content:space-between;align-items:center;padding:20px 0 6px;font-size:13px;color:var(--mute)}
.meta button{text-decoration:underline;text-underline-offset:3px;font-size:13px;color:var(--mute)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px 22px;padding:14px 0 80px}
.card{background:var(--card);cursor:pointer;transition:transform .25s ease,box-shadow .25s ease;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(40,30,20,.35)}
.card .ph{aspect-ratio:4/5;overflow:hidden;background:#f3f0eb}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.card:hover img{transform:scale(1.035)}
.card .tx{padding:16px 16px 18px}
.card .ref{font-size:11px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.card .nm{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:500;line-height:1.15;margin:6px 0 6px}
.card .ln{font-size:13px;color:var(--mute);line-height:1.5}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 0}

/* detail */
#dlg{position:fixed;inset:0;background:rgba(29,26,23,.55);display:none;z-index:40;overflow:auto;padding:28px 16px}
#dlg.open{display:block}
.panel{background:var(--bg);max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);min-height:min(86vh,820px);position:relative}
.close{position:absolute;top:10px;right:12px;width:42px;height:42px;font-size:26px;line-height:1;color:var(--ink);z-index:2;background:rgba(251,249,246,.85);border-radius:50%}
.gal{background:#f3f0eb;display:flex;flex-direction:column}
.main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:420px;cursor:zoom-in;overflow:hidden}
.main img{max-width:100%;max-height:78vh;object-fit:contain;display:block;transition:transform .2s ease}
.main.zoom{cursor:zoom-out}
.main.zoom img{transform:scale(2)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.85);font-size:20px;display:flex;align-items:center;justify-content:center}
.nav.p{left:12px}.nav.n{right:12px}
.thumbs{display:flex;gap:8px;padding:12px;justify-content:center;flex-wrap:wrap}
.thumbs button{width:72px;height:72px;overflow:hidden;opacity:.55;border:1px solid transparent}
.thumbs button.on{opacity:1;border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{padding:56px 44px 40px;display:flex;flex-direction:column}
.info .ref{font-size:12px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.info h2{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:38px;line-height:1.08;margin:10px 0 8px}
.info .ln{color:var(--mute);font-size:15px}
.specs{margin:30px 0;border-top:1px solid var(--line)}
.specs div{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}
.specs dt{color:var(--mute)}
.specs dd{text-align:right}
.cta{margin-top:auto}
.cta a{display:block;text-align:center;padding:16px;background:var(--ink);color:#fff;text-decoration:none;letter-spacing:.2em;text-transform:uppercase;font-size:12px;font-weight:400}
.cta a:hover{background:#000}
.cta .alt{margin-top:14px;font-size:13px;color:var(--mute);text-align:center;line-height:1.6}
.cta .alt button{text-decoration:underline;text-underline-offset:3px;color:var(--ink);font-size:13px}
.cta .ok{color:var(--gold)}
footer{text-align:center;color:var(--mute);font-size:12px;letter-spacing:.12em;padding:0 24px 50px}

@media (max-width:820px){
  .panel{grid-template-columns:1fr}
  .info{padding:28px 22px 30px}
  .info h2{font-size:30px}
  .main{min-height:300px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
  .card .nm{font-size:18px}
  .card .tx{padding:12px}
  header{padding:34px 16px 18px}
  header .note{margin-top:10px;font-size:13px}
  .wrap{padding:0 14px}
  .cats{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;gap:0;padding:12px 0 4px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cats button{padding:9px 12px;font-size:12px;white-space:nowrap}
  .bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0 16px}
  .bar .search{grid-column:1/-1}
  .sel select,.search{min-width:0;width:100%;font-size:14px;padding:9px 30px 9px 12px}
  .search{padding:9px 14px}
  .chk{font-size:13px;padding:9px 12px;justify-content:center}
  .meta{padding:14px 0 4px}
}
</style>
</head>
<body>

<div id="gate">
  <form id="gf" autocomplete="off">
    <div class="mark">CARTIER</div>
    <div class="sub">Private Selection</div>
    <input id="pw" type="password" placeholder="Enter password" aria-label="Password" autofocus>
    <button type="submit">View collection</button>
    <div class="err" id="err"></div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="mark">CARTIER</div>
    <div class="sub">A Private Selection · Fuse</div>
    <p class="note" id="note"></p>
  </header>
  <div class="wrap">
    <nav class="cats" id="cats"></nav>
    <div class="bar">
      <input class="search" id="q" type="search" placeholder="Search pieces">
      <label class="sel"><select id="fColl"></select></label>
      <label class="sel"><select id="fMetal"></select></label>
      <label class="sel"><select id="fStone"></select></label>
      <label class="sel"><select id="fSize"></select></label>
      <label class="chk"><input type="checkbox" id="fPapers"> With papers</label>
    </div>
    <div class="meta"><span id="count"></span><button id="reset">Clear filters</button></div>
    <main class="grid" id="grid"></main>
  </div>
  <footer>All pieces estate / pre-owned · Photos of the actual pieces</footer>
</div>

<div id="dlg" role="dialog" aria-modal="true">
  <div class="panel">
    <button class="close" id="x" aria-label="Close">×</button>
    <div class="gal">
      <div class="main" id="main"><img id="big" alt=""><button class="nav p" id="prev" aria-label="Previous photo">‹</button><button class="nav n" id="next" aria-label="Next photo">›</button></div>
      <div class="thumbs" id="th"></div>
    </div>
    <div class="info">
      <div class="ref" id="dRef"></div>
      <h2 id="dName"></h2>
      <div class="ln" id="dLine"></div>
      <dl class="specs" id="dSpecs"></dl>
      <div class="cta">
        <a id="msg" href="#">Message Aasim about this piece</a>
        <div class="alt">or email <b id="addr"></b> · <button id="copy">Copy message</button> <span id="copied" class="ok"></span></div>
      </div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
const CONTACT = "info@fusejewelry.com";
const HASH = "ef9f42c96c14b69be1b5497080f9d0b905d0ddde706fa930a641c389c26c71c4";
const $ = s => document.querySelector(s);

async function sha(t){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function unlock(){ $("#gate").remove(); $("#app").hidden=false; init(); }
try{ if(sessionStorage.getItem("cx-ok")===HASH) unlock(); }catch(e){}
$("#gf").addEventListener("submit", async e=>{
  e.preventDefault();
  if(await sha($("#pw").value.trim()) === HASH){ try{sessionStorage.setItem("cx-ok",HASH)}catch(e){} unlock(); }
  else { $("#err").textContent="Incorrect password"; $("#pw").select(); }
});

const S = (it,k) => (it.spec.find(s=>s[0]===k)||[])[1];
const metalKey = m => /Yellow/.test(m)?"Yellow Gold":/Rose/.test(m)?"Rose Gold":/White/.test(m)?"White Gold":/Tri/.test(m)?"Tri-Color Gold":m;
const stoneKey = it => { const s=S(it,"Stones")||""; return !s?"No stones":/diamond/i.test(s)&&!/sapphire|gemstone|onyx|pearl/i.test(s)?"Diamonds":/diamond/i.test(s)?"Diamonds & colored stones":"Colored stones"; };
const line = it => [S(it,"Metal"), S(it,"Stones"), S(it,"Size")?("Size "+S(it,"Size")):null].filter(Boolean).join(" · ");
const CATS=[["All","All"],["Ring","Rings"],["Bracelet","Bracelets"],["Necklace","Necklaces"],["Earrings","Earrings"]];
let st={cat:"All"};

function opts(sel,label,vals){ sel.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option>${v}</option>`).join(""); }
function uniq(a){ return [...new Set(a.filter(Boolean))]; }

function init(){
  const I=ITEMS;
  $("#note").textContent = `${I.length} pieces · Rings, bracelets, necklaces & earrings`;
  $("#cats").innerHTML = CATS.map(([k,l])=>`<button data-c="${k}" class="${k==="All"?"on":""}">${l}<span>${k==="All"?I.length:I.filter(i=>i.cat===k).length}</span></button>`).join("");
  $("#cats").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; st.cat=b.dataset.c; [...$("#cats").children].forEach(x=>x.classList.toggle("on",x===b)); render(); };
  opts($("#fColl"),"All collections",uniq(I.map(i=>S(i,"Collection"))).sort());
  opts($("#fMetal"),"All metals",["Yellow Gold","Rose Gold","White Gold","Platinum","Tri-Color Gold"].filter(m=>I.some(i=>metalKey(S(i,"Metal"))===m)));
  opts($("#fStone"),"Any stones",["Diamonds","Diamonds & colored stones","Colored stones","No stones"].filter(s=>I.some(i=>stoneKey(i)===s)));
  opts($("#fSize"),"Any size",uniq(I.map(i=>S(i,"Size"))).sort((a,b)=>a-b));
  ["#q","#fColl","#fMetal","#fStone","#fSize","#fPapers"].forEach(s=>$(s).addEventListener("input",render));
  $("#reset").onclick=()=>{ ["#q","#fColl","#fMetal","#fStone","#fSize"].forEach(s=>$(s).value=""); $("#fPapers").checked=false; st.cat="All"; [...$("#cats").children].forEach((x,n)=>x.classList.toggle("on",n===0)); render(); };
  $("#grid").onclick=e=>{ const c=e.target.closest(".card"); if(c) open(c.dataset.r); };
  render();
}

function filtered(){
  const q=$("#q").value.trim().toLowerCase(), co=$("#fColl").value, me=$("#fMetal").value, sto=$("#fStone").value, sz=$("#fSize").value, pa=$("#fPapers").checked;
  return ITEMS.filter(i=>(st.cat==="All"||i.cat===st.cat)
    &&(!co||S(i,"Collection")===co)&&(!me||metalKey(S(i,"Metal"))===me)&&(!sto||stoneKey(i)===sto)
    &&(!sz||S(i,"Size")===sz)&&(!pa||S(i,"Papers"))
    &&(!q||(i.name+" "+i.ref+" "+i.spec.map(s=>s[1]).join(" ")).toLowerCase().includes(q)));
}
function render(){
  const L=filtered();
  $("#count").textContent = `${L.length} ${L.length===1?"piece":"pieces"}`;
  $("#grid").innerHTML = L.length? L.map(i=>`<button class="card" data-r="${i.ref}"><div class="ph"><img loading="lazy" src="${i.photos[0].t}" alt="${i.name}"></div><div class="tx"><div class="ref">${i.ref}</div><div class="nm">${i.name}</div><div class="ln">${line(i)}</div></div></button>`).join("")
    : `<div class="empty">No pieces match these filters.</div>`;
}

let cur=null, ix=0;
function show(n){
  ix=(n+cur.photos.length)%cur.photos.length;
  $("#main").classList.remove("zoom");
  $("#big").src=cur.photos[ix].f;
  [...$("#th").children].forEach((b,k)=>b.classList.toggle("on",k===ix));
}
function message(it){ return `Hi Aasim, I'm interested in ${it.ref} – ${it.name} (${line(it)}). Could you tell me more?`; }
function open(ref){
  cur=ITEMS.find(i=>i.ref===ref);
  $("#dRef").textContent="Item "+cur.ref; $("#dName").textContent=cur.name; $("#dLine").textContent=line(cur);
  $("#dSpecs").innerHTML=cur.spec.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join("");
  $("#th").innerHTML=cur.photos.map((p,k)=>`<button data-k="${k}" aria-label="Photo ${k+1}"><img src="${p.t}" alt=""></button>`).join("");
  $("#th").style.display=cur.photos.length>1?"flex":"none";
  $("#prev").style.display=$("#next").style.display=cur.photos.length>1?"flex":"none";
  $("#msg").href=`mailto:${CONTACT}?subject=${encodeURIComponent("Cartier inquiry – "+cur.ref)}&body=${encodeURIComponent(message(cur))}`;
  $("#addr").textContent=CONTACT; $("#copied").textContent="";
  show(0); $("#dlg").classList.add("open"); document.body.style.overflow="hidden"; $("#dlg").scrollTop=0;
}
function close(){ $("#dlg").classList.remove("open"); document.body.style.overflow=""; }
$("#x").onclick=close;
$("#dlg").onclick=e=>{ if(e.target.id==="dlg") close(); };
$("#th").onclick=e=>{ const b=e.target.closest("button"); if(b) show(+b.dataset.k); };
$("#prev").onclick=e=>{e.stopPropagation(); show(ix-1)};
$("#next").onclick=e=>{e.stopPropagation(); show(ix+1)};
$("#main").onclick=e=>{ if(e.target.closest(".nav")) return; $("#main").classList.toggle("zoom"); };
$("#main").onmousemove=e=>{ if(!$("#main").classList.contains("zoom")) return; const r=$("#main").getBoundingClientRect(); $("#big").style.transformOrigin=`${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`; };
$("#copy").onclick=async()=>{ try{ await navigator.clipboard.writeText(`To: ${CONTACT}\n\n${message(cur)}`); $("#copied").textContent="Copied"; }catch(e){ $("#copied").textContent="Copy not available here"; } };
document.addEventListener("keydown",e=>{ if(!$("#dlg").classList.contains("open")) return; if(e.key==="Escape") close(); if(e.key==="ArrowLeft") show(ix-1); if(e.key==="ArrowRight") show(ix+1); });
</script>
</body>
</html>
